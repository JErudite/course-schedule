<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f5" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://dpjyjzszqmgakwtdhmwq.supabase.co wss://dpjyjzszqmgakwtdhmwq.supabase.co; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; media-src 'none'; worker-src 'none'"
    />
    <title>我的课程表</title>
    <link rel="stylesheet" href="styles.css?v=20260801-2" />
  </head>
  <body>
    <section class="login-screen" id="loginScreen">
      <div class="login-panel">
        <div class="login-brand">
          <span class="brand-mark" aria-hidden="true">课</span>
          <div>
            <p class="eyebrow">课程安排与实时同步</p>
            <h1>登录课程表</h1>
          </div>
        </div>
        <form class="login-form" id="loginForm">
          <label class="form-field">
            <span>用户名</span>
            <input id="loginUsername" name="username" type="text" maxlength="40" autocomplete="username" placeholder="请输入用户名" required />
          </label>
          <label class="form-field">
            <span>密码</span>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required />
          </label>
          <p class="login-error" id="loginError" role="alert" aria-live="polite"></p>
          <button class="primary-button login-submit" id="loginSubmit" type="submit">
            <i data-lucide="log-in"></i>
            <span>进入课程表</span>
          </button>
        </form>
      </div>
    </section>

    <main class="app-shell" id="appShell" hidden>
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">课</span>
          <div>
            <p class="eyebrow" id="termLabel">正在读取当前学期</p>
            <h1>我的课程表</h1>
          </div>
        </div>

        <div class="week-controls" aria-label="周次切换">
          <button class="icon-button" id="previousWeek" type="button" aria-label="上一周" title="上一周">
            <i data-lucide="chevron-left"></i>
          </button>
          <button class="week-picker" id="currentWeek" type="button" aria-label="返回本周">
            <span id="weekLabel">本周</span>
            <small id="weekRange">正在读取日期</small>
          </button>
          <button class="icon-button" id="nextWeek" type="button" aria-label="下一周" title="下一周">
            <i data-lucide="chevron-right"></i>
          </button>
        </div>

        <div class="topbar-actions">
          <span class="sync-state is-connecting" id="syncState" role="status" aria-live="polite">
            <i class="sync-dot" aria-hidden="true"></i>
            <span id="syncStateText">正在连接</span>
          </span>
          <button class="today-button" id="todayButton" type="button">
            <i data-lucide="calendar-days"></i>
            <span>返回本周</span>
          </button>
          <button class="today-button student-manager-button" id="studentManagerButton" type="button" hidden>
            <i data-lucide="users"></i>
            <span>账号管理</span>
          </button>
          <button class="auth-button is-authenticated" id="authButton" type="button" aria-label="退出登录">
            <i data-lucide="log-out"></i>
            <span>退出登录</span>
          </button>
        </div>
      </header>

      <section class="schedule-section" aria-labelledby="scheduleTitle">
        <div class="section-heading">
          <div>
            <p class="eyebrow" id="todayText">周一，4月13日</p>
            <h2 id="scheduleTitle">本周安排</h2>
          </div>
          <button class="primary-button add-course-button" id="addCourse" type="button" hidden>
            <i data-lucide="plus"></i>
            <span>新增课程</span>
          </button>
        </div>

        <div class="schedule-scroll" id="scheduleScroll">
          <div class="schedule-grid" id="scheduleGrid" aria-label="一周课程表"></div>
        </div>
      </section>

      <footer class="page-footer">
        <p>
          共 <strong id="courseCount">0</strong> 门课程 · 本周
          <strong id="occurrenceCount">0</strong> 次 ·
          <strong id="durationCount">0</strong> 小时
        </p>
        <p id="permissionHint">只读模式 · 管理员的修改会实时显示在这里</p>
      </footer>
    </main>

    <dialog class="course-dialog" id="courseDialog">
      <div class="dialog-accent" id="dialogAccent"></div>
      <div class="dialog-header">
        <div class="dialog-heading-copy">
          <p class="eyebrow" id="dialogType">课程详情</p>
          <div class="dialog-title-row">
            <h3 id="dialogTitle">课程名称</h3>
            <div class="dialog-course-actions" id="dialogCourseActions" hidden>
              <button class="icon-button edit-course-button" id="editCourse" type="button" aria-label="编辑课程" title="编辑课程">
                <i data-lucide="pencil"></i>
              </button>
              <button class="icon-button delete-course-button" id="deleteCourse" type="button" aria-label="删除课程" title="删除课程">
                <i data-lucide="trash-2"></i>
              </button>
            </div>
          </div>
        </div>
        <button class="icon-button dialog-close" id="closeDialog" type="button" aria-label="关闭" title="关闭">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="dialog-details" id="dialogDetails">
        <p><i data-lucide="clock-3"></i><span id="dialogTime"></span></p>
        <p><i data-lucide="users-round"></i><span id="dialogStudents"></span></p>
        <p><i data-lucide="repeat-2"></i><span id="dialogRepeat"></span></p>
        <div class="dialog-notes">
          <i data-lucide="notebook-pen"></i>
          <div>
            <small>备注</small>
            <p id="dialogNotes">暂无备注</p>
          </div>
        </div>
      </div>

      <form class="dialog-form" id="courseForm" hidden>
        <label class="form-field form-field-wide">
          <span>课程名称</span>
          <input id="courseNameInput" name="name" type="text" maxlength="60" required />
        </label>
        <label class="form-field">
          <span>首次上课日期</span>
          <input id="courseStartDateInput" name="startDate" type="date" required />
        </label>
        <label class="form-field">
          <span>重复方式</span>
          <select id="courseRepeatInput" name="repeat">
            <option value="">不重复</option>
            <option value="1">每天</option>
            <option value="2">每 2 天</option>
            <option value="3">每 3 天</option>
            <option value="7">每周</option>
            <option value="custom">自定义间隔</option>
          </select>
        </label>
        <label class="form-field form-field-wide" id="customRepeatField" hidden>
          <span>间隔天数</span>
          <div class="number-field-with-suffix">
            <input id="courseRepeatDaysInput" name="repeatDays" type="number" min="1" max="365" step="1" value="4" />
            <span>天</span>
          </div>
        </label>
        <label class="form-field">
          <span>开始时间</span>
          <input id="courseStartTimeInput" name="startTime" type="time" min="08:00" max="20:50" step="600" required />
        </label>
        <label class="form-field">
          <span>持续时长</span>
          <select id="courseDurationInput" name="duration"></select>
        </label>
        <label class="form-field form-field-wide">
          <span>备注</span>
          <textarea id="courseNotesInput" name="notes" maxlength="500" rows="4" placeholder="记录课程要求、准备事项等"></textarea>
        </label>
        <fieldset class="student-assignment-field form-field-wide">
          <legend>上课学生</legend>
          <div class="student-checklist" id="studentChecklist"></div>
          <p class="empty-list-hint" id="studentChecklistEmpty" hidden>暂无学生账号，请先前往账号管理中新增。</p>
        </fieldset>
        <div class="form-actions">
          <button class="secondary-button" id="cancelEdit" type="button">取消</button>
          <button class="primary-button" id="saveCourse" type="submit">
            <i data-lucide="save"></i>
            <span id="saveCourseText">保存修改</span>
          </button>
        </div>
      </form>
    </dialog>

    <dialog class="confirm-dialog" id="deleteDialog">
      <div class="confirm-dialog-icon" aria-hidden="true"><i data-lucide="trash-2"></i></div>
      <h3>删除课程</h3>
      <p>“<strong id="deleteCourseName"></strong>”及其全部重复安排都将被删除。</p>
      <div class="confirm-actions">
        <button class="secondary-button" id="cancelDelete" type="button">取消</button>
        <button class="danger-button" id="confirmDelete" type="button">确认删除</button>
      </div>
    </dialog>

    <dialog class="student-dialog" id="studentDialog">
      <div class="login-dialog-header">
        <div>
          <p class="eyebrow">后台管理</p>
          <h3>访客账号授权</h3>
        </div>
        <button class="icon-button" id="closeStudentDialog" type="button" aria-label="关闭" title="关闭">
          <i data-lucide="x"></i>
        </button>
      </div>
      <form class="student-create-form" id="studentForm">
        <label class="form-field">
          <span>学生姓名 / 登录用户名</span>
          <input id="studentUsernameInput" name="username" type="text" maxlength="40" autocomplete="off" placeholder="例如：张三" required />
        </label>
        <button class="primary-button" id="addStudentButton" type="submit">
          <i data-lucide="user-plus"></i>
          <span>新增账号</span>
        </button>
      </form>
      <p class="shared-password-note"><i data-lucide="key-round"></i><span>所有访客账号统一使用密码 <strong>88888888</strong></span></p>
      <div class="student-list-heading">
        <strong>已授权访客</strong>
        <span id="studentCount">0 人</span>
      </div>
      <div class="student-list" id="studentList"></div>
      <p class="empty-list-hint" id="studentListEmpty">暂无访客账号</p>
    </dialog>

    <dialog class="confirm-dialog" id="deleteStudentDialog">
      <div class="confirm-dialog-icon" aria-hidden="true"><i data-lucide="user-minus"></i></div>
      <h3>删除访客账号</h3>
      <p>删除“<strong id="deleteStudentName"></strong>”后，该账号将失去课程查看权限，已有课程分配也会一并移除。</p>
      <div class="confirm-actions">
        <button class="secondary-button" id="cancelDeleteStudent" type="button">取消</button>
        <button class="danger-button" id="confirmDeleteStudent" type="button">确认删除</button>
      </div>
    </dialog>

    <div class="status-message" id="statusMessage" role="status" aria-live="polite"></div>

    <script src="vendor/lucide-0.468.0.min.js"></script>
    <script src="vendor/supabase-2.111.0.min.js"></script>
    <script src="app.js?v=20260801-2"></script>
  </body>
</html>
