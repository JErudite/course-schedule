<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f5" />
    <title>我的课程表</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">课</span>
          <div>
            <p class="eyebrow">2025 - 2026 学年 · 春季学期</p>
            <h1>我的课程表</h1>
          </div>
        </div>

        <div class="week-controls" aria-label="周次切换">
          <button class="icon-button" id="previousWeek" type="button" aria-label="上一周" title="上一周">
            <i data-lucide="chevron-left"></i>
          </button>
          <button class="week-picker" id="currentWeek" type="button" aria-label="返回本周">
            <span id="weekLabel">第 9 周</span>
            <small id="weekRange">4月13日 - 4月19日</small>
          </button>
          <button class="icon-button" id="nextWeek" type="button" aria-label="下一周" title="下一周">
            <i data-lucide="chevron-right"></i>
          </button>
        </div>

        <div class="topbar-actions">
          <span class="sync-state is-connecting" id="syncState" role="status" aria-live="polite">
            <i class="sync-dot" aria-hidden="true"></i>
            <span id="syncStateText">正在连接</span>
          </span>
          <button class="today-button" id="todayButton" type="button">
            <i data-lucide="calendar-days"></i>
            <span>返回本周</span>
          </button>
          <button class="auth-button" id="authButton" type="button" aria-label="管理员登录">
            <i data-lucide="lock-keyhole"></i>
            <span>管理员登录</span>
          </button>
        </div>
      </header>

      <section class="schedule-section" aria-labelledby="scheduleTitle">
        <div class="section-heading">
          <div>
            <p class="eyebrow" id="todayText">周一，4月13日</p>
            <h2 id="scheduleTitle">本周安排</h2>
          </div>
          <button class="primary-button add-course-button" id="addCourse" type="button" hidden>
            <i data-lucide="plus"></i>
            <span>新增课程</span>
          </button>
        </div>

        <div class="schedule-scroll" id="scheduleScroll">
          <div class="schedule-grid" id="scheduleGrid" aria-label="一周课程表"></div>
        </div>
      </section>

      <footer class="page-footer">
        <p>
          共 <strong id="courseCount">0</strong> 门课程 · 本周
          <strong id="occurrenceCount">0</strong> 次 ·
          <strong id="durationCount">0</strong> 小时
        </p>
        <p id="permissionHint">只读模式 · 管理员的修改会实时显示在这里</p>
      </footer>
    </main>

    <dialog class="course-dialog" id="courseDialog">
      <div class="dialog-accent" id="dialogAccent"></div>
      <div class="dialog-header">
        <div class="dialog-heading-copy">
          <p class="eyebrow" id="dialogType">课程详情</p>
          <div class="dialog-title-row">
            <h3 id="dialogTitle">课程名称</h3>
            <div class="dialog-course-actions" id="dialogCourseActions" hidden>
              <button class="icon-button edit-course-button" id="editCourse" type="button" aria-label="编辑课程" title="编辑课程">
                <i data-lucide="pencil"></i>
              </button>
              <button class="icon-button delete-course-button" id="deleteCourse" type="button" aria-label="删除课程" title="删除课程">
                <i data-lucide="trash-2"></i>
              </button>
            </div>
          </div>
        </div>
        <button class="icon-button dialog-close" id="closeDialog" type="button" aria-label="关闭" title="关闭">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="dialog-details" id="dialogDetails">
        <p><i data-lucide="clock-3"></i><span id="dialogTime"></span></p>
        <p><i data-lucide="user-round"></i><span id="dialogTeacher"></span></p>
        <p><i data-lucide="repeat-2"></i><span id="dialogRepeat"></span></p>
        <div class="dialog-notes">
          <i data-lucide="notebook-pen"></i>
          <div>
            <small>备注</small>
            <p id="dialogNotes">暂无备注</p>
          </div>
        </div>
      </div>

      <form class="dialog-form" id="courseForm" hidden>
        <label class="form-field form-field-wide">
          <span>课程名称</span>
          <input id="courseNameInput" name="name" type="text" maxlength="60" required />
        </label>
        <label class="form-field form-field-wide">
          <span>任课老师</span>
          <input id="courseTeacherInput" name="teacher" type="text" maxlength="40" required />
        </label>
        <label class="form-field">
          <span>首次上课日期</span>
          <input id="courseStartDateInput" name="startDate" type="date" required />
        </label>
        <label class="form-field">
          <span>重复方式</span>
          <select id="courseRepeatInput" name="repeat">
            <option value="">不重复</option>
            <option value="1">每天</option>
            <option value="2">每 2 天</option>
            <option value="3">每 3 天</option>
            <option value="7">每周</option>
            <option value="custom">自定义间隔</option>
          </select>
        </label>
        <label class="form-field form-field-wide" id="customRepeatField" hidden>
          <span>间隔天数</span>
          <div class="number-field-with-suffix">
            <input id="courseRepeatDaysInput" name="repeatDays" type="number" min="1" max="365" step="1" value="4" />
            <span>天</span>
          </div>
        </label>
        <label class="form-field">
          <span>开始时间</span>
          <input id="courseStartTimeInput" name="startTime" type="time" min="08:00" max="20:50" step="600" required />
        </label>
        <label class="form-field">
          <span>持续时长</span>
          <select id="courseDurationInput" name="duration"></select>
        </label>
        <label class="form-field form-field-wide">
          <span>备注</span>
          <textarea id="courseNotesInput" name="notes" maxlength="500" rows="4" placeholder="记录课程要求、准备事项等"></textarea>
        </label>
        <div class="form-actions">
          <button class="secondary-button" id="cancelEdit" type="button">取消</button>
          <button class="primary-button" id="saveCourse" type="submit">
            <i data-lucide="save"></i>
            <span id="saveCourseText">保存修改</span>
          </button>
        </div>
      </form>
    </dialog>

    <dialog class="confirm-dialog" id="deleteDialog">
      <div class="confirm-dialog-icon" aria-hidden="true"><i data-lucide="trash-2"></i></div>
      <h3>删除课程</h3>
      <p>“<strong id="deleteCourseName"></strong>”及其全部重复安排都将被删除。</p>
      <div class="confirm-actions">
        <button class="secondary-button" id="cancelDelete" type="button">取消</button>
        <button class="danger-button" id="confirmDelete" type="button">确认删除</button>
      </div>
    </dialog>

    <dialog class="login-dialog" id="loginDialog">
      <div class="login-dialog-header">
        <div>
          <p class="eyebrow">管理员身份验证</p>
          <h3>登录后编辑课程</h3>
        </div>
        <button class="icon-button" id="closeLoginDialog" type="button" aria-label="关闭" title="关闭">
          <i data-lucide="x"></i>
        </button>
      </div>
      <form id="loginForm">
        <label class="form-field">
          <span>管理员邮箱</span>
          <input id="loginEmail" name="email" type="email" autocomplete="email" placeholder="请输入管理员邮箱" required />
        </label>
        <p class="login-note">登录链接将发送到邮箱，点击邮件中的链接即可完成登录。</p>
        <button class="primary-button login-submit" id="loginSubmit" type="submit">
          <i data-lucide="mail"></i>
          <span>发送登录链接</span>
        </button>
      </form>
    </dialog>

    <div class="status-message" id="statusMessage" role="status" aria-live="polite"></div>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
  </body>
</html>
